<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web Blocker Focus Timer — Embed example</title>
  <style>
    body { margin: 0; padding: 20px; font: 16px/1.5 system-ui, sans-serif; color: #202020; background: #f5f5f5; }
    main { max-width: 760px; margin: auto; }
    h1 { font-size: 24px; }
    #timer { margin-top: 20px; }
    button { font: inherit; padding: 8px 14px; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>Web Blocker Focus Timer</h1>
    <p>This example embeds the npm component. Use the timer below, or <a href="../timer.html">open the standalone timer</a>.</p>
    <p><a href="https://github.com/YanTM/web-blocker-focus-timer">Source and instructions</a></p>
    <button id="toggle" type="button">Remove timer</button>
    <div id="timer"></div>
  </main>
  <script type="module">
    import { mountFocusTimer } from '../index.js';
    const target = document.getElementById('timer');
    const toggle = document.getElementById('toggle');
    let timer = mountFocusTimer(target);
    toggle.addEventListener('click', () => {
      if (timer) {
        timer.destroy();
        timer = null;
        toggle.textContent = 'Mount a fresh timer';
      } else {
        timer = mountFocusTimer(target);
        toggle.textContent = 'Remove timer';
      }
    });
  </script>
</body>
</html>
